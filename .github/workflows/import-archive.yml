name: Import project archive

on:
  push:
    branches: [main]
    paths:
      - "store-cloudflare.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract source archive
        run: |
          test -f store-cloudflare.zip
          unzip -o store-cloudflare.zip -d .
          rm store-cloudflare.zip
          git status --short
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Store Cloudflare project" || echo "No changes to commit"
          git push
